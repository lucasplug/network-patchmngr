name: Publish container image

# Bouwt de image en publiceert hem naar GitHub Container Registry, zodat de
# Docker-VM hem alleen nog hoeft te pullen (Portainer-stack met image:).
#
# Bewust met kale docker-commando's in plaats van docker/*-actions: elke
# action moet eerst van codeload.github.com worden gehaald, en juist die
# downloads faalden tijdens een GitHub-storing. Nu is er nog één action.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and push
        env:
          REGISTRY: ghcr.io
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          docker build \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:${GITHUB_SHA::7}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"
          echo "Gepubliceerd: $IMAGE:latest en $IMAGE:${GITHUB_SHA::7}"
